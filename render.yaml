services:
  - type: web
    name: aws-security-analyzer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: APP_NAME
        value: AWS Security Analyzer
      - key: APP_VERSION
        value: "2.0"
      - key: AWS_REGION
        value: us-east-1